<svg width="600" height="214" viewBox="0 0 600 214" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LOCK-FIX Air-Gap Protection">
  <defs>
    <linearGradient id="wordBlue" x1="154" y1="58" x2="446" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#031F52"/>
      <stop offset="0.72" stop-color="#07306D"/>
      <stop offset="1" stop-color="#0B73E8"/>
    </linearGradient>
    <filter id="softTextShadow" x="72" y="22" width="456" height="176" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0A4B95" flood-opacity="0.055"/>
    </filter>
    <radialGradient id="pulseGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 166) rotate(90) scale(54)">
      <stop offset="0" stop-color="#0A73E8" stop-opacity=".28"/>
      <stop offset=".44" stop-color="#0A73E8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0A73E8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .pulse-glow {
        transform-origin: 300px 166px;
        animation: pulseGlow 1.7s ease-in-out infinite;
      }
      .pulse-ring {
        transform-origin: 300px 166px;
        animation: pulseRing 1.7s ease-out infinite;
      }
      .pulse-ring-delay {
        transform-origin: 300px 166px;
        animation: pulseRing 1.7s ease-out .42s infinite;
      }
      .pulse-core {
        transform-origin: 300px 166px;
        animation: pulseCore 1.7s ease-in-out infinite;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: .58; transform: scale(.9); }
        50% { opacity: 1; transform: scale(1.18); }
      }
      @keyframes pulseRing {
        0% { opacity: .62; transform: scale(.58); }
        76% { opacity: .05; transform: scale(1.85); }
        100% { opacity: 0; transform: scale(2.06); }
      }
      @keyframes pulseCore {
        0%, 100% { opacity: .74; transform: scale(.9); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </defs>

  <g filter="url(#softTextShadow)">
    <text x="300" y="94" text-anchor="middle" fill="url(#wordBlue)" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="950" letter-spacing="2.6">LOCK-FIX</text>
    <text x="300" y="138" text-anchor="middle" fill="#0A3468" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="6.2">AIR-GAP PROTECTION</text>
  </g>

  <circle class="pulse-glow" cx="300" cy="166" r="54" fill="url(#pulseGlow)"/>
  <circle class="pulse-ring" cx="300" cy="166" r="18" fill="none" stroke="#0A73E8" stroke-width="3.2"/>
  <circle class="pulse-ring-delay" cx="300" cy="166" r="18" fill="none" stroke="#7BBEFF" stroke-width="2.4"/>
  <circle class="pulse-core" cx="300" cy="166" r="7.4" fill="#0A73E8"/>
</svg>
